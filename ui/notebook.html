<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep — Notebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="http://fonts.googleapis.com/css?family=Lato|Lora|Inconsolata" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:          #eeeeee;
            --surface:     #e4e4e4;
            --surface2:    #d8d8d8;
            --border:      #cccccc;
            --accent:      #3377aa;
            --accent-dim:  #255580;
            --text:        #000000;
            --text-dim:    #666666;
            --text-muted:  #999999;
            --danger:      #cc3333;
            --mono:        'Inconsolata', monospace;
            --sans:        'Lato', sans-serif;
            --serif:       'Lora', serif;
        }

        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
        body { display: flex; flex-direction: column; }

        /* ── Header ── */
        header {
            display: flex; align-items: center; gap: 16px;
            padding: 12px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        header h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
        header .back-link {
            font-size: 12px; color: var(--text-dim); text-decoration: none;
            border: 1px solid var(--border); padding: 4px 10px;
        }
        header .back-link:hover { color: var(--accent); border-color: var(--accent); }
        header .spacer { flex: 1; }
        .btn-logout {
            padding: 4px 10px; background: transparent; border: 1px solid var(--border);
            color: var(--text-dim); font-family: var(--sans); font-size: 10px; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.15s;
        }
        .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

        /* ── Tag bar ── */
        .tag-bar {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 10px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .tag-input-wrap { display: flex; gap: 6px; }
        .tag-input {
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            font-family: var(--mono); font-size: 13px; padding: 6px 10px; outline: none;
            width: 200px; transition: border-color 0.15s;
        }
        .tag-input:focus { border-color: var(--accent); }
        .btn {
            font-family: var(--sans); font-size: 12px; font-weight: 700; padding: 6px 14px;
            border: 1px solid var(--border); background: var(--surface2); color: var(--text);
            cursor: pointer; transition: all 0.15s;
        }
        .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-primary:hover:not(:disabled) { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }

        .known-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag-pill {
            font-size: 11px; font-family: var(--mono); color: var(--text-dim);
            border: 1px solid var(--border); padding: 3px 9px; cursor: pointer; transition: all 0.15s;
        }
        .tag-pill:hover { color: var(--accent); border-color: var(--accent); }
        .tag-pill.active { color: #fff; background: var(--accent); border-color: var(--accent); }

        /* ── Empty / signed-out states ── */
        .empty-state {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 13px; text-align: center; line-height: 1.8;
        }
        .empty-state a { color: var(--accent); }

        /* ── Flow layout ── */
        .flow-wrap {
            display: none;
            flex: 1;
            min-height: 0;
            grid-template-columns: 1fr 4px 1fr;
        }
        .flow-wrap.active { display: grid; }

        .flow-sticky {
            display: flex; flex-direction: column;
            min-width: 280px;
            padding: 20px 24px;
            overflow: hidden;
        }
        .flow-tag {
            display: inline-block; font-family: var(--mono); font-size: 11px;
            color: var(--accent); margin-bottom: 10px;
        }
        .doc-textarea {
            flex: 1; resize: none; width: 100%;
            background: var(--surface); border: 1px solid var(--border); color: var(--text);
            font-family: var(--serif); font-size: 15px; line-height: 1.7;
            padding: 16px; outline: none; transition: border-color 0.15s;
        }
        .doc-textarea:focus { border-color: var(--accent); }
        .doc-footer {
            display: flex; align-items: center; gap: 10px; margin-top: 10px;
        }
        .doc-status { font-size: 11px; color: var(--text-muted); flex: 1; }

        /* ── Divider ── */
        .divider {
            position: relative;
            background: var(--border);
            cursor: col-resize;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .divider:hover, .divider.dragging { background: var(--accent); }
        .divider::after {
            content: '';
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 4px; height: 2rem; background: var(--text-muted); border-radius: 2px;
        }

        /* ── Stream (scroll) pane ── */
        .flow-scroll {
            display: flex; flex-direction: column;
            min-width: 280px;
            padding: 20px 24px;
            overflow-y: auto;
        }
        .composer {
            display: flex; flex-direction: column; gap: 8px;
            margin-bottom: 20px; padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .composer-textarea {
            width: 100%; resize: vertical; min-height: 60px;
            background: var(--surface); border: 1px solid var(--border); color: var(--text);
            font-family: var(--sans); font-size: 13px; line-height: 1.6;
            padding: 10px 12px; outline: none; transition: border-color 0.15s;
        }
        .composer-textarea:focus { border-color: var(--accent); }
        .composer-footer { display: flex; align-items: center; gap: 10px; }
        .composer-hint { font-size: 11px; color: var(--text-muted); flex: 1; }

        .stream-empty { color: var(--text-muted); font-size: 12px; text-align: center; padding: 30px 0; }

        .post {
            background: var(--surface); border: 1px solid var(--border);
            padding: 12px 14px; margin-bottom: 12px;
        }
        .post-meta {
            display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
        }
        .post-date { font-size: 10px; color: var(--text-muted); font-family: var(--mono); flex: 1; }
        .post-merge {
            font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
            color: var(--accent); background: transparent; border: 1px solid var(--accent);
            padding: 3px 8px; cursor: pointer; transition: all 0.15s;
        }
        .post-merge:hover { background: var(--accent); color: #fff; }
        .post-body {
            font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap;
        }
        .post-failed { border-color: var(--danger); border-style: dashed; }
        .post-failed .post-date { color: var(--danger); }
        .post-body-failed { color: var(--text-muted); font-style: italic; }

        /* ── Responsive ── */
        @media (max-width: 750px) {
            .flow-wrap.active { display: flex; flex-direction: column; }
            .divider { display: none; }
            .flow-sticky { max-height: 40vh; }
        }
    </style>
    <link rel="stylesheet" href="toast.css">
    <script src="toast.js"></script>
</head>
<body>

<header>
    <h1>Deep — Notebook</h1>
    <a class="back-link" id="hatcheck-link" href="http://localhost:8090/ui/index.html">&larr; Hatcheck</a>
    <div class="spacer"></div>
    <button class="btn-logout" id="logout-btn" onclick="logout()" style="display:none;">Sign out</button>
</header>

<div class="tag-bar" id="tag-bar" style="display:none;">
    <div class="tag-input-wrap">
        <input class="tag-input" id="tag-input" type="text" placeholder="tag"
               onkeydown="if(event.key==='Enter') openTagFromInput()">
        <button class="btn btn-primary" onclick="openTagFromInput()">Open</button>
    </div>
    <div class="known-tags" id="known-tags"></div>
</div>

<div class="empty-state" id="empty-state">Enter a tag above to open its notebook.</div>

<section class="flow-wrap" id="flow-wrap">
    <section class="flow-sticky" id="flow-left">
        <span class="flow-tag" id="doc-tag-label"></span>
        <textarea class="doc-textarea" id="doc-textarea" placeholder="Notebook document — Markdown source."></textarea>
        <div class="doc-footer">
            <span class="doc-status" id="doc-status"></span>
            <button class="btn btn-primary" id="save-btn" onclick="saveDocument()">Save</button>
        </div>
    </section>

    <div class="divider" id="divider"></div>

    <section class="flow-scroll" id="flow-right">
        <div class="composer">
            <textarea class="composer-textarea" id="composer-textarea" placeholder="New post…"></textarea>
            <div class="composer-footer">
                <span class="composer-hint" id="composer-hint"></span>
                <button class="btn btn-primary" onclick="postToStream()">Post</button>
            </div>
        </div>
        <div id="stream-list"></div>
    </section>
</section>

<div class="toast" id="toast">
    <div class="toast-label" id="toast-label">Info</div>
    <div id="toast-msg"></div>
</div>

<script>
// Deep's API is same-origin — the browser talks only to Deep here. Deep in
// turn talks to Hatcheck on the caller's behalf, forwarding these same
// session/capability values; Deep holds no credentials of its own.
const API = '';

// ── Auth handoff from Hatcheck ──
// Identity and login stay entirely Hatcheck's job. This page never shows a
// login form of its own — it either receives a session via a handoff link
// from Hatcheck's own UI (tokens carried as query params, since Deep is a
// different origin and sessionStorage doesn't cross that boundary), or
// finds one already stored here from an earlier handoff this session.
let sessionJWT      = sessionStorage.getItem('session_jwt') || '';
let capabilityToken = sessionStorage.getItem('capability_token') || '';

function captureHandoff() {
    const params = new URLSearchParams(window.location.search);
    const jwt = params.get('session_jwt');
    const cap = params.get('capability_token');
    if (!jwt) return;

    window.history.replaceState({}, '', window.location.pathname);

    sessionJWT = jwt;
    sessionStorage.setItem('session_jwt', sessionJWT);
    if (cap) {
        capabilityToken = cap;
        sessionStorage.setItem('capability_token', capabilityToken);
    }
}

function updateAuthUI() {
    const loggedIn = !!sessionJWT;
    document.getElementById('tag-bar').style.display = loggedIn ? '' : 'none';
    document.getElementById('logout-btn').style.display = loggedIn ? '' : 'none';
    document.getElementById('flow-wrap').classList.remove('active');

    const emptyState = document.getElementById('empty-state');
    emptyState.style.display = 'flex';
    emptyState.innerHTML = loggedIn
        ? 'Enter a tag above to open its notebook.'
        : 'Not signed in. <a href="http://localhost:8090/ui/index.html">Sign in on Hatcheck</a>, then open Notebook from there.';
}

function logout() {
    sessionJWT = '';
    capabilityToken = '';
    sessionStorage.removeItem('session_jwt');
    sessionStorage.removeItem('capability_token');
    updateAuthUI();
    showToast('Signed out', 'Sign in again on Hatcheck to come back.');
}

async function apiFetch(url, options = {}) {
    const headers = { ...(options.headers || {}) };
    if (sessionJWT) headers['Authorization'] = `Bearer ${sessionJWT}`;
    if (capabilityToken) headers['X-Capability-Token'] = capabilityToken;
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401) {
        logout();
        showToast('Session expired', 'Please sign in again on Hatcheck.', true);
        throw new Error('Session expired');
    }
    return res;
}

document.addEventListener('DOMContentLoaded', () => {
    captureHandoff();
    updateAuthUI();
    if (sessionJWT) loadKnownTags();
});

// ── Notebook state ──
let currentTag = '';
let streamCache = {}; // hash -> content, for the merge action

async function loadKnownTags() {
    try {
        const res = await apiFetch(`${API}/notebooks`);
        if (!res.ok) return;
        const tags = await res.json();
        const container = document.getElementById('known-tags');
        container.innerHTML = '';
        (tags || []).forEach(tag => {
            const pill = document.createElement('span');
            pill.className = 'tag-pill' + (tag === currentTag ? ' active' : '');
            pill.textContent = '#' + tag;
            pill.title = 'Open notebook for #' + tag;
            pill.onclick = () => openTag(tag);
            container.appendChild(pill);
        });
    } catch (err) {
        // Ambient listing failure isn't fatal — the tag input still works.
    }
}

function openTagFromInput() {
    const tag = document.getElementById('tag-input').value.trim().replace(/^#/, '');
    if (!tag) return;
    openTag(tag);
}

// A generation guard, same reasoning as before: if the user opens a
// different tag before this one finishes loading, the slower call
// shouldn't render over the newer one. Deep's single composed response
// removes most of what caused this before, but cheap insurance against
// network reordering is still worth keeping.
let loadGeneration = 0;

async function openTag(tag) {
    const myGeneration = ++loadGeneration;
    currentTag = tag;
    document.getElementById('tag-input').value = tag;
    document.getElementById('doc-tag-label').textContent = '#' + tag;
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('flow-wrap').classList.add('active');
    document.getElementById('doc-status').textContent = 'Loading…';
    document.getElementById('composer-hint').textContent = '';

    try {
        const res = await apiFetch(`${API}/notebook/${encodeURIComponent(tag)}`);
        if (!res.ok) throw new Error('failed to load notebook');
        const view = await res.json();
        if (myGeneration !== loadGeneration) return; // a newer open has since started
        renderNotebook(view);
    } catch (err) {
        if (myGeneration !== loadGeneration) return;
        showToast('Load failed', err.message, true);
        document.getElementById('doc-status').textContent = 'Failed to load.';
    }

    loadKnownTags();
}

function renderNotebook(view) {
    document.getElementById('doc-textarea').value = view.document ? view.document.content : '';
    document.getElementById('doc-status').textContent = view.document
        ? 'Loaded.'
        : 'No document yet for #' + view.tag + ' — save to create one.';

    streamCache = {};
    const listEl = document.getElementById('stream-list');

    if (!view.stream || view.stream.length === 0) {
        listEl.innerHTML = '<div class="stream-empty">No posts tagged #' + escHtml(view.tag) + ' yet.</div>';
        return;
    }

    view.stream.forEach(p => { if (!p.failed) streamCache[p.hash] = p.content; });

    listEl.innerHTML = view.stream.map(p => p.failed ? `
        <div class="post post-failed">
            <div class="post-meta">
                <span class="post-date">Failed to load</span>
                <button class="post-merge" onclick="openTag(currentTag)">Retry</button>
            </div>
            <div class="post-body post-body-failed">This post couldn't be fetched from Hatcheck. Retry to reload.</div>
        </div>
    ` : `
        <div class="post">
            <div class="post-meta">
                <span class="post-date">${p.created ? escHtml(new Date(p.created).toLocaleString()) : 'unknown date'}</span>
                <button class="post-merge" onclick="mergePost('${escAttr(p.hash)}')">Merge &rarr;</button>
            </div>
            <div class="post-body">${escHtml(p.content)}</div>
        </div>
    `).join('');
}

// Inserts a post's content into the document textarea at the current
// cursor position (or replacing the current selection), rather than
// always appending at the end.
function mergePost(hash) {
    const content = streamCache[hash];
    if (content === undefined) return;
    const textarea = document.getElementById('doc-textarea');
    const start = textarea.selectionStart;
    const end   = textarea.selectionEnd;
    const before = textarea.value.slice(0, start);
    const after  = textarea.value.slice(end);
    const needsLeadingBreak  = before.length > 0 && !before.endsWith('\n\n');
    const needsTrailingBreak = after.length > 0 && !after.startsWith('\n\n');
    const insert = (needsLeadingBreak ? '\n\n' : '') + content + (needsTrailingBreak ? '\n\n' : '');
    textarea.value = before + insert + after;
    const cursor = before.length + insert.length;
    textarea.focus();
    textarea.setSelectionRange(cursor, cursor);
    document.getElementById('doc-status').textContent = 'Merged — not yet saved.';
}

// Saves the document. Deep resolves the previous version, stashes the new
// one, repoints notebook/<tag>, and records the supersedes relation, all in
// one call — the client no longer tracks a doc hash or walks any chain.
async function saveDocument() {
    if (!currentTag) return;
    const btn = document.getElementById('save-btn');
    const content = document.getElementById('doc-textarea').value;

    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
        const res = await apiFetch(`${API}/notebook/${encodeURIComponent(currentTag)}/document`, {
            method: 'POST',
            body: content,
        });
        if (!res.ok) throw new Error(await res.text());

        document.getElementById('doc-status').textContent = 'Saved.';
        showToast('Saved', 'Notebook document for #' + currentTag + ' updated.');
        openTag(currentTag); // reload the full view, including the refreshed stream
    } catch (err) {
        showToast('Save failed', err.message, true);
        document.getElementById('doc-status').textContent = 'Save failed.';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Save';
    }
}

// Posts new content. Deep ensures the tag is present in the content —
// the client just sends what the user typed.
async function postToStream() {
    const textarea = document.getElementById('composer-textarea');
    const content = textarea.value.trim();
    if (!content || !currentTag) return;

    try {
        const res = await apiFetch(`${API}/notebook/${encodeURIComponent(currentTag)}/posts`, {
            method: 'POST',
            body: content,
        });
        if (!res.ok) throw new Error(await res.text());
        textarea.value = '';
        document.getElementById('composer-hint').textContent = '';
        openTag(currentTag);
    } catch (err) {
        showToast('Post failed', err.message, true);
    }
}

// ── Draggable divider ──
document.querySelectorAll('.flow-wrap').forEach(wrap => {
    const divider = wrap.querySelector('.divider');
    const left    = wrap.querySelector('.flow-sticky');
    if (!divider || !left) return;

    let dragging = false;

    divider.addEventListener('mousedown', () => {
        dragging = true;
        divider.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const rect = wrap.getBoundingClientRect();
        const min  = 240;
        const max  = wrap.offsetWidth - 244;
        const w    = Math.max(min, Math.min(max, e.clientX - rect.left));
        wrap.style.gridTemplateColumns = `${w}px 4px 1fr`;
    });

    document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        divider.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
    });
});

// ── Helpers ──
function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function escAttr(str) {
    return String(str).replace(/'/g, "\\'");
}
</script>

</body>
</html>
